# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Volume Configuration Tests
templates:
  - service.yaml
set:
  name: my-service
  image: gcr.io/my-project/my-app:v1
  project: my-project

tests:
  # No Volumes
  - it: should not set volumes when not specified
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts
      - notExists:
          path: spec.template.spec.volumes

  # Secret Volume Tests
  - it: should mount secret volume with latest version
    set:
      volumes:
        config:
          secret:
            name: my-secret
            items:
              - path: config.json
      volumeMounts:
        - name: config
          mountPath: /etc/config
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            secret:
              secretName: 'my-secret'
              items:
                - key: 'latest'
                  path: 'config.json'
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: '/etc/config'

  - it: should mount secret volume with specific versions
    set:
      volumes:
        keys:
          secret:
            name: my-keys
            items:
              - version: '1'
                path: old_key.pem
              - version: '2'
                path: new_key.pem
      volumeMounts:
        - name: keys
          mountPath: /etc/keys
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: keys
            secret:
              secretName: 'my-keys'
              items:
                - key: '1'
                  path: 'old_key.pem'
                - key: '2'
                  path: 'new_key.pem'
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: keys
            mountPath: '/etc/keys'

  # EmptyDir Volume Tests
  - it: should mount emptyDir volume
    set:
      volumes:
        cache:
          emptyDir:
            size: 256Mi
      volumeMounts:
        - name: cache
          mountPath: /cache
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: cache
            emptyDir:
              sizeLimit: '256Mi'
              medium: Memory
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: cache
            mountPath: '/cache'

  # GCS Volume Tests
  - it: should mount GCS volume with default options
    set:
      volumes:
        data:
          gcs:
            bucket: my-bucket
      volumeMounts:
        - name: data
          mountPath: /data
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            csi:
              driver: gcsfuse.run.googleapis.com
              readOnly: false
              volumeAttributes:
                bucketName: 'my-bucket'
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: '/data'

  - it: should mount GCS volume with custom options as quoted comma-separated list
    set:
      volumes:
        data:
          gcs:
            bucket: my-bucket
            readOnly: true
            mountOptions:
              file-mode: '0644'
              dir-mode: '0755'
              uid: '1000'
              gid: '1000'
      volumeMounts:
        - name: data
          mountPath: /data
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            csi:
              driver: gcsfuse.run.googleapis.com
              readOnly: true
              volumeAttributes:
                bucketName: 'my-bucket'
                mountOptions: 'dir-mode=0755,file-mode=0644,gid=1000,uid=1000'
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: '/data'

  # NFS Volume Tests
  - it: should mount NFS volume
    set:
      volumes:
        shared:
          nfs:
            server: 10.0.0.1
            path: /exports/data
      volumeMounts:
        - name: shared
          mountPath: /shared
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: shared
            nfs:
              readOnly: false
              server: '10.0.0.1'
              path: '/exports/data'
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: shared
            mountPath: '/shared'

  # Volume Name Validation
  - it: should fail when volume name contains uppercase
    set:
      volumes:
        myVolume:
          emptyDir:
            size: 256Mi
      volumeMounts:
        - name: myVolume
          mountPath: /data
    asserts:
      - failedTemplate: {}

  - it: should fail when volume name contains invalid characters
    set:
      volumes:
        my_volume:
          emptyDir:
            size: 256Mi
      volumeMounts:
        - name: my_volume
          mountPath: /data
    asserts:
      - failedTemplate: {}

  # Mount Path Validation
  - it: should fail when mountPath doesn't start with /
    set:
      volumes:
        data:
          emptyDir:
            size: 256Mi
      volumeMounts:
        - name: data
          mountPath: data
    asserts:
      - failedTemplate: {}
